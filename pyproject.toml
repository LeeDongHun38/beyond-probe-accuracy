[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probedir"
version = "1.0.0"
description = "Estimation stability, intervention specificity, and quantization geometry of linear probe directions (EACL 2027)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyyaml>=6",
  "safetensors>=0.4",
]

[project.optional-dependencies]
gpu = ["torch>=2.1", "transformers>=4.46", "accelerate>=0.26"]
quant = ["autoawq>=0.2.7", "auto-gptq>=0.7.1"]
pairs = ["openai>=1.0", "datasets>=2.19"]
paper = ["pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
probedir = "probedir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
